<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 60 1200 710" role="img" aria-label="Conviction AI architecture: browser UI calls a FastAPI server, which does all math in engine.py and stores data in a Salesforce-shaped Postgres database"><style>svg{--cont:#f3f5f8;--panel:#ffffff;--line:#d6dce4;--line2:#aab4c2;--acc:#0c7f86;--accsoft:#e0f2f2;--edge:#5b6778;--ink:#0d1726;--muted:#55606f;--f-ui:'IBM Plex Sans', Helvetica, Arial, sans-serif;--f-mono:'IBM Plex Mono', Menlo, monospace}
.cont{fill:var(--cont);stroke:var(--line);stroke-width:1}
.box{fill:var(--panel);stroke:var(--line2);stroke-width:1.2}
.box.acc{fill:var(--accsoft);stroke:var(--acc);stroke-width:2}
.box.dash{stroke-dasharray:5 4}
.box.plan{fill:none}
.band{fill:var(--cont);stroke:none}
.edge{fill:none;stroke:var(--edge);stroke-width:1.4}
.edge.ret{stroke-dasharray:5 4}
.ahead{fill:var(--edge)}
.life{stroke:var(--line);stroke-width:1;stroke-dasharray:3 4}
text{font-family:var(--f-ui)}
.th{fill:var(--ink);font-size:15px;font-weight:600}
.tn{fill:var(--ink);font-size:13px;font-weight:600}
.ts{fill:var(--muted);font-size:11.5px}
.tq{fill:var(--muted);font-size:11.5px}
.te{fill:var(--muted);font-size:11.5px;font-family:var(--f-mono)}
</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahead" d="M0 0L10 5L0 10z"/></marker></defs><rect y="60" width="1200" height="710" fill="#ffffff"/><rect class="cont" x="40" y="80" width="320" height="356" rx="12"/><text class="th" x="60" y="108" text-anchor="start">Browser</text><text class="tq" x="60" y="126" text-anchor="start">localhost:8000</text><rect class="cont" x="440" y="80" width="320" height="356" rx="12"/><text class="th" x="460" y="108" text-anchor="start">API server</text><text class="tq" x="460" y="126" text-anchor="start">FastAPI on uvicorn, port 8000</text><rect class="cont" x="840" y="80" width="320" height="356" rx="12"/><text class="th" x="860" y="108" text-anchor="start">PostgreSQL 18</text><text class="tq" x="860" y="126" text-anchor="start">database conviction_ai</text><rect class="box" x="60" y="140" width="280" height="72" rx="8"/><text class="tn" x="72" y="164" text-anchor="start">React UI</text><text class="ts" x="72" y="182" text-anchor="start">web/dist/index.html</text><text class="ts" x="72" y="198" text-anchor="start">9 screens in one self-contained file</text><rect class="box" x="60" y="236" width="280" height="72" rx="8"/><text class="tn" x="72" y="260" text-anchor="start">api.js</text><text class="ts" x="72" y="278" text-anchor="start">the only file that calls the server</text><text class="ts" x="72" y="294" text-anchor="start">maps Salesforce fields to the screens</text><rect class="box dash" x="60" y="340" width="280" height="72" rx="8"/><text class="tn" x="72" y="364" text-anchor="start">Offline mode</text><text class="ts" x="72" y="382" text-anchor="start">engine.js + data.js bundled in</text><text class="ts" x="72" y="398" text-anchor="start">double-click to open, no server</text><rect class="box" x="460" y="140" width="280" height="72" rx="8"/><text class="tn" x="472" y="164" text-anchor="start">main.py · routes</text><text class="ts" x="472" y="182" text-anchor="start">/api/accounts · /api/opportunities</text><text class="ts" x="472" y="198" text-anchor="start">/api/segments · /claims · /returns</text><rect class="box acc" x="460" y="236" width="132" height="88" rx="8"/><text class="tn" x="472" y="260" text-anchor="start">engine.py</text><text class="ts" x="472" y="278" text-anchor="start">NRR · GRR · TAM</text><text class="ts" x="472" y="294" text-anchor="start">MOIC · IRR · radar</text><text class="ts" x="472" y="310" text-anchor="start">pure, unit-tested</text><rect class="box" x="608" y="236" width="132" height="88" rx="8"/><text class="tn" x="620" y="260" text-anchor="start">db.py</text><text class="ts" x="620" y="278" text-anchor="start">psycopg 3</text><text class="ts" x="620" y="294" text-anchor="start">DATABASE_URL</text><text class="ts" x="620" y="310" text-anchor="start">read from .env</text><rect class="box" x="460" y="364" width="280" height="56" rx="8"/><text class="tn" x="472" y="388" text-anchor="start">Swagger docs at /docs</text><text class="ts" x="472" y="406" text-anchor="start">try every endpoint in the browser</text><rect class="box" x="860" y="140" width="280" height="104" rx="8"/><text class="tn" x="872" y="164" text-anchor="start">Standard objects</text><text class="ts" x="872" y="182" text-anchor="start">account: Startup, PE Target, Investor</text><text class="ts" x="872" y="198" text-anchor="start">contact · opportunity · task</text><text class="ts" x="872" y="214" text-anchor="start">opportunity_field_history</text><text class="ts" x="872" y="230" text-anchor="start">content_document</text><rect class="box" x="860" y="260" width="280" height="88" rx="8"/><text class="tn" x="872" y="284" text-anchor="start">Custom objects (__c)</text><text class="ts" x="872" y="302" text-anchor="start">fund · segment · account_segment</text><text class="ts" x="872" y="318" text-anchor="start">funding_round · round_participant</text><text class="ts" x="872" y="334" text-anchor="start">evidence_claim · customer_arr</text><rect class="box" x="860" y="364" width="280" height="56" rx="8"/><text class="tn" x="872" y="388" text-anchor="start">Rules in the schema</text><text class="ts" x="872" y="406" text-anchor="start">CHECKs · FKs · one primary segment</text><path class="edge" d="M458 160H342" marker-end="url(#ah)"/><text class="te" x="400" y="152" text-anchor="middle">serves UI</text><path class="edge" d="M340 262H400V190H458" marker-end="url(#ah)"/><text class="te" x="400" y="284" text-anchor="middle">fetch</text><text class="te" x="400" y="298" text-anchor="middle">/api/*</text><text class="te" x="400" y="312" text-anchor="middle">JSON</text><path class="edge" d="M526 206V234" marker-end="url(#ah)"/><path class="edge" d="M674 206V234" marker-end="url(#ah)"/><text class="te" x="532" y="224" text-anchor="start">calls</text><text class="te" x="680" y="224" text-anchor="start">uses</text><path class="edge" d="M740 288H838" marker-end="url(#ah)" marker-start="url(#ah)"/><text class="te" x="789" y="280" text-anchor="middle">SQL</text><text class="th" x="40" y="486" text-anchor="start">Build and data pipeline</text><text class="tq" x="40" y="504" text-anchor="start">make build · make db</text><rect class="box" x="40" y="520" width="180" height="44" rx="8"/><text class="tn" x="130.0" y="547" text-anchor="middle">web/src/*.jsx</text><rect class="box" x="280" y="520" width="180" height="44" rx="8"/><text class="tn" x="370.0" y="547" text-anchor="middle">build.mjs (esbuild)</text><rect class="box" x="520" y="520" width="180" height="44" rx="8"/><text class="tn" x="610.0" y="547" text-anchor="middle">web/dist/index.html</text><path class="edge" d="M220 542H278" marker-end="url(#ah)"/><path class="edge" d="M460 542H518" marker-end="url(#ah)"/><path class="edge" d="M610 520V438" marker-end="url(#ah)"/><text class="te" x="618" y="482" text-anchor="start">served at /</text><rect class="box" x="40" y="600" width="180" height="44" rx="8"/><text class="tn" x="130.0" y="627" text-anchor="middle">web/src/data.js</text><rect class="box" x="280" y="600" width="180" height="44" rx="8"/><text class="tn" x="370.0" y="627" text-anchor="middle">export-seed.mjs</text><rect class="box" x="520" y="600" width="180" height="44" rx="8"/><text class="tn" x="610.0" y="627" text-anchor="middle">db/seed.json</text><rect class="box" x="760" y="600" width="180" height="44" rx="8"/><text class="tn" x="850.0" y="627" text-anchor="middle">seed.py + schema.sql</text><path class="edge" d="M220 622H278" marker-end="url(#ah)"/><path class="edge" d="M460 622H518" marker-end="url(#ah)"/><path class="edge" d="M700 622H758" marker-end="url(#ah)"/><path class="edge" d="M900 600V438" marker-end="url(#ah)"/><text class="te" x="908" y="482" text-anchor="start">creates tables,</text><text class="te" x="908" y="496" text-anchor="start">loads demo data</text><rect class="box" x="980" y="510" width="180" height="72" rx="8"/><text class="tn" x="992" y="534" text-anchor="start">make test</text><text class="ts" x="992" y="552" text-anchor="start">pytest: 17 on Postgres</text><text class="ts" x="992" y="568" text-anchor="start">node: 10 engine tests</text><rect class="box" x="980" y="600" width="180" height="72" rx="8"/><text class="tn" x="992" y="624" text-anchor="start">GitHub Actions CI</text><text class="ts" x="992" y="642" text-anchor="start">each push: Postgres 16</text><text class="ts" x="992" y="658" text-anchor="start">+ every test</text><text class="th" x="40" y="700" text-anchor="start">Planned, not built yet</text><rect class="box dash plan" x="40" y="714" width="260" height="44" rx="8"/><text class="tn" x="170.0" y="741" text-anchor="middle">Salesforce Dev org sync</text><rect class="box dash plan" x="320" y="714" width="260" height="44" rx="8"/><text class="tn" x="450.0" y="741" text-anchor="middle">LLM analyst (Anthropic API)</text><rect class="box dash plan" x="600" y="714" width="260" height="44" rx="8"/><text class="tn" x="730.0" y="741" text-anchor="middle">PDF deck parser</text><rect class="box dash plan" x="880" y="714" width="260" height="44" rx="8"/><text class="tn" x="1010.0" y="741" text-anchor="middle">Snowflake market data</text></svg>