<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 636" role="img" aria-label="Two requests traced: reading NRR recomputes it in engine.py from Postgres rows; moving a deal writes the stage and its audit record in one transaction"><style>svg{--cont:#f3f5f8;--panel:#ffffff;--line:#d6dce4;--line2:#aab4c2;--acc:#0c7f86;--accsoft:#e0f2f2;--edge:#5b6778;--ink:#0d1726;--muted:#55606f;--f-ui:'IBM Plex Sans', Helvetica, Arial, sans-serif;--f-mono:'IBM Plex Mono', Menlo, monospace}
