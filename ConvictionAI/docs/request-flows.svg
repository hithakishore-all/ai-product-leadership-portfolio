</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahead" d="M0 0L10 5L0 10z"/></marker></defs><rect y="0" width="1140" height="636" fill="#ffffff"/><rect class="box" x="30" y="20" width="160" height="40" rx="8"/><text class="tn" x="110" y="45" text-anchor="middle">Browser UI</text><line class="life" x1="110" y1="60" x2="110" y2="620"/><rect class="box" x="260" y="20" width="160" height="40" rx="8"/><text class="tn" x="340" y="45" text-anchor="middle">api.js</text><line class="life" x1="340" y1="60" x2="340" y2="620"/><rect class="box" x="490" y="20" width="160" height="40" rx="8"/><text class="tn" x="570" y="45" text-anchor="middle">FastAPI</text><line class="life" x1="570" y1="60" x2="570" y2="620"/><rect class="box acc" x="720" y="20" width="160" height="40" rx="8"/><text class="tn" x="800" y="45" text-anchor="middle">engine.py</text><line class="life" x1="800" y1="60" x2="800" y2="620"/><rect class="box" x="950" y="20" width="160" height="40" rx="8"/><text class="tn" x="1030" y="45" text-anchor="middle">PostgreSQL</text><line class="life" x1="1030" y1="60" x2="1030" y2="620"/><rect class="band" x="20" y="78" width="1100" height="26" rx="6"/><text class="tn" x="32" y="96" text-anchor="start">Read · Company 360 → Load data room</text><path class="edge" d="M114 134H336" marker-end="url(#ah)"/><text class="te" x="225.0" y="127" text-anchor="middle">retention(&#x27;helioops&#x27;)</text><path class="edge" d="M344 168H566" marker-end="url(#ah)"/><text class="te" x="455.0" y="161" text-anchor="middle">GET …/helioops/retention</text><path class="edge" d="M574 202H1026" marker-end="url(#ah)"/><text class="te" x="800.0" y="195" text-anchor="middle">SELECT customer_arr__c rows</text><path class="edge ret" d="M1026 236H574" marker-end="url(#ah)"/><text class="te" x="800.0" y="229" text-anchor="middle">16 rows · claimed NRR 124%</text><path class="edge" d="M574 270H796" marker-end="url(#ah)"/><text class="te" x="685.0" y="263" text-anchor="middle">cohort_bridge() · nrr() · grr()</text><path class="edge ret" d="M796 304H574" marker-end="url(#ah)"/><text class="te" x="685.0" y="297" text-anchor="middle">NRR 113% · GRR 90%</text><path class="edge ret" d="M566 338H344" marker-end="url(#ah)"/><text class="te" x="455.0" y="331" text-anchor="middle">JSON: nrr, gap_pp = 11</text><path class="edge ret" d="M336 372H114" marker-end="url(#ah)"/><text class="te" x="225.0" y="365" text-anchor="middle">red card: 124% vs 113%</text><rect class="band" x="20" y="404" width="1100" height="26" rx="6"/><text class="tn" x="32" y="422" text-anchor="start">Write · Deal Pipeline → move a card one stage</text><path class="edge" d="M114 460H336" marker-end="url(#ah)"/><text class="te" x="225.0" y="453" text-anchor="middle">moveDeal(&#x27;d3&#x27;, &#x27;Diligence&#x27;)</text><path class="edge" d="M344 494H566" marker-end="url(#ah)"/><text class="te" x="455.0" y="487" text-anchor="middle">PATCH /api/opportunities/d3</text><path class="edge" d="M574 528H1026" marker-end="url(#ah)"/><text class="te" x="800.0" y="521" text-anchor="middle">UPDATE opportunity + INSERT history</text><path class="edge ret" d="M1026 562H574" marker-end="url(#ah)"/><text class="te" x="800.0" y="555" text-anchor="middle">committed together</text><path class="edge ret" d="M566 596H114" marker-end="url(#ah)"/><text class="te" x="340.0" y="589" text-anchor="middle">200 OK → toast &#x27;saved to Postgres&#x27;</text></svg>