<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Conviction AI</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>/* Layout: fixed navy rail + scanning workspace; decision first, evidence one click away. */
:root {
  --bg: #eef1f5; --panel: #ffffff; --panel2: #f6f8fb; --ink: #0d1726; --muted: #5a6677; --faint: #8a95a5; --line: #dbe1e9;
  --rail: #0a1729; --rail2: #12243c; --railink: #c9d4e3; --railmute: #7f91a8;
  --accent: #0c7f86; --accentsoft: #dff1f1; --ok: #2c7a4b; --oksoft: #e2f2e8; --warn: #a8660b; --warnsoft: #fbefd9; --risk: #b3322b; --risksoft: #f9e1df;
  --c1: #0c7f86; --c2: #4a5fc1; --c3: #b3322b; --c4: #8a5a9e; --c5: #c27b12; --c6: #4f7d3a;
  --f-ui: "Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
  --f-num: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --f-memo: "Source Serif 4", Georgia, serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #08111d; --panel: #0f1b2b; --panel2: #13223559; --ink: #e5ecf4; --muted: #9aa8ba; --faint: #6d7b8e; --line: #20314a;
  --rail: #050c16; --rail2: #0e1c2f; --railink: #c9d4e3; --railmute: #7488a2;
  --accent: #3fc2c4; --accentsoft: #0f3436; --ok: #5cc28a; --oksoft: #113222; --warn: #e3a24a; --warnsoft: #3a2a10; --risk: #f07b72; --risksoft: #3d1715;
  --c1: #3fc2c4; --c2: #8b9cf2; --c3: #f07b72; --c4: #c79be0; --c5: #e3a24a; --c6: #8fc173; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #08111d; --panel: #0f1b2b; --panel2: #13223559; --ink: #e5ecf4; --muted: #9aa8ba; --faint: #6d7b8e; --line: #20314a;
  --rail: #050c16; --rail2: #0e1c2f; --railink: #c9d4e3; --railmute: #7488a2;
  --accent: #3fc2c4; --accentsoft: #0f3436; --ok: #5cc28a; --oksoft: #113222; --warn: #e3a24a; --warnsoft: #3a2a10; --risk: #f07b72; --risksoft: #3d1715;
  --c1: #3fc2c4; --c2: #8b9cf2; --c3: #f07b72; --c4: #c79be0; --c5: #e3a24a; --c6: #8fc173; color-scheme: dark }

html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-ui); font-size: 14px; line-height: 1.45; }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
h1 { font-size: 22px; font-weight: 650; letter-spacing: -0.01em; }
h2 { font-size: 15px; font-weight: 650; }
h3 { font-size: 13px; font-weight: 650; }
p { margin: 0; }
.eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
.muted { color: var(--muted); }
.small { font-size: 12px; }

.app { display: grid; grid-template-columns: 228px minmax(0, 1fr); min-height: 100%; }
.rail { background: var(--rail); color: var(--railink); padding: 18px 12px; position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 18px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 8px; }
.brand-mark { width: 28px; height: 28px; border-radius: 7px; background: linear-gradient(135deg, #3fc2c4, #1b5e8a); display: grid; place-items: center; color: #04121c; font-weight: 800; font-size: 14px; }
.brand b { font-size: 15px; color: #fff; letter-spacing: -0.01em; }
.brand span { display: block; font-size: 10.5px; color: var(--railmute); letter-spacing: 0.06em; text-transform: uppercase; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav-group { font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--railmute); padding: 10px 10px 4px; }
.nav a { display: flex; align-items: center; justify-content: space-between; gap: 8px; color: var(--railink); text-decoration: none; padding: 7px 10px; border-radius: 6px; font-size: 13.5px; }
.nav a:hover { background: var(--rail2); }
.nav a.on { background: var(--rail2); color: #fff; box-shadow: inset 2px 0 0 #3fc2c4; }
.nav .pip { font-size: 10.5px; padding: 1px 6px; border-radius: 9px; background: #5a1f1c; color: #ffb4ac; font-family: var(--f-num); }
.rail-foot { margin-top: auto; font-size: 11px; color: var(--railmute); padding: 0 10px; line-height: 1.5; }

.main { min-width: 0; display: flex; flex-direction: column; }
.banner { background: var(--warnsoft); color: var(--warn); font-size: 12px; padding-block: 6px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
.banner b { letter-spacing: 0.08em; }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line); padding-block: 10px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.seg-ctl { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; background: var(--panel2); }
.seg-ctl button { border: 0; background: transparent; padding: 5px 11px; font-size: 12.5px; color: var(--muted); }
.seg-ctl button.on { background: var(--ink); color: var(--panel); }
.select { border: 1px solid var(--line); background: var(--panel); border-radius: 7px; padding: 5px 8px; font-size: 12.5px; }
.ask { flex: 1 1 260px; min-width: 0; position: relative; }
.ask input { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px 7px 30px; background: var(--panel2); }
.ask::before { content: "✦"; position: absolute; left: 11px; top: 7px; color: var(--accent); font-size: 13px; }
.chip-asof { font-size: 12px; color: var(--muted); white-space: nowrap; }

.page { padding-block: 22px 60px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 18px; max-width: 1360px; width: 100%; }
.page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.page-head p { color: var(--muted); max-width: 70ch; margin-top: 4px; }
.crumbs { font-size: 12px; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 4px; }
.crumbs a { color: var(--accent); text-decoration: none; }

.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g-main { grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
.panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.kpi { display: flex; flex-direction: column; gap: 4px; }
.kpi .v { font-family: var(--f-num); font-size: 24px; font-weight: 500; letter-spacing: -0.02em; }
.kpi .l { font-size: 12px; color: var(--muted); }
.strip { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
.strip > div { padding: 14px 16px; border-left: 1px solid var(--line); }
.strip > div:first-child { border-left: 0; }

.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 7px; padding: 6px 12px; font-size: 13px; font-weight: 550; display: inline-flex; gap: 6px; align-items: center; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--panel); }
.btn.ghost { background: transparent; }
.btn.sm { padding: 3px 8px; font-size: 12px; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.linkish { background: none; border: 0; color: var(--accent); padding: 0; font-weight: 550; }

.tag { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 10px; white-space: nowrap; border: 1px solid transparent; }
.t-verified, .t-calculated { background: var(--oksoft); color: var(--ok); }
.t-company, .t-third { background: var(--accentsoft); color: var(--accent); }
.t-inferred, .t-assumption { background: var(--panel2); color: var(--muted); border-color: var(--line); }
.t-missing { background: transparent; color: var(--faint); border: 1px dashed var(--faint); }
.t-disputed { background: var(--risksoft); color: var(--risk); }
.t-synthetic { background: var(--warnsoft); color: var(--warn); }
.t-upload { background: var(--accentsoft); color: var(--accent); }

.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--panel2); }
tr.sel td { background: var(--accentsoft); }
td.r, th.r { text-align: right; }

.bar { height: 6px; background: var(--panel2); border-radius: 3px; overflow: hidden; border: 1px solid var(--line); }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 3px; transition: width .4s; }

.chart text { fill: var(--muted); font-size: 11px; font-family: var(--f-ui); }
.chart .grid-l { stroke: var(--line); stroke-width: 1; }
.chart .axis-t { fill: var(--faint); font-size: 10.5px; }
.chart .bub { transition: transform .7s cubic-bezier(.2,.8,.2,1); cursor: pointer; }
@media (prefers-reduced-motion: reduce) { .chart .bub, .bar > i { transition: none; } }

.callout { border-radius: 10px; padding: 14px 16px; display: flex; gap: 14px; align-items: flex-start; flex-wrap: wrap; }
.callout.risk { background: var(--risksoft); border: 1px solid color-mix(in srgb, var(--risk) 35%, transparent); }
.callout.ok { background: var(--oksoft); border: 1px solid color-mix(in srgb, var(--ok) 35%, transparent); }
.callout.info { background: var(--accentsoft); border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent); }
.callout.warn { background: var(--warnsoft); border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent); }
.big-compare { display: flex; gap: 22px; align-items: baseline; flex-wrap: wrap; }
.big-compare .num { font-size: 30px; font-weight: 500; }

.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { border: 0; background: none; padding: 8px 12px; color: var(--muted); font-weight: 550; border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs button.on { color: var(--ink); border-bottom-color: var(--accent); }

.kanban { display: grid; grid-template-columns: repeat(7, minmax(170px, 1fr)); gap: 10px; overflow-x: auto; padding-bottom: 6px; }
.col { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 8px; min-height: 160px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 6px; }

.field { display: flex; flex-direction: column; gap: 4px; }
.field label { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
.field input[type=number], .field input[type=text], .field select, textarea { border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; background: var(--panel); width: 100%; }
input[type=range] { width: 100%; accent-color: var(--accent); }
.src { font-size: 10.5px; color: var(--faint); }

.overlay { position: fixed; inset: 0; background: rgba(5, 12, 22, 0.55); z-index: 50; display: flex; justify-content: flex-end; }
.drawer { background: var(--panel); width: min(720px, 100%); height: 100%; overflow-y: auto; padding-block: 22px 40px; padding-left: max(22px, env(safe-area-inset-left, 0px)); padding-right: max(22px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 16px; box-shadow: -10px 0 40px rgba(0,0,0,.25); }
.slide { border: 1px solid var(--line); border-radius: 8px; background: var(--rail); color: #e9eef5; padding: 18px; display: flex; flex-direction: column; gap: 10px; aspect-ratio: 16 / 9; max-width: 100%; justify-content: center; }
.slide .hl { background: rgba(240,123,114,.25); outline: 2px solid #f07b72; border-radius: 4px; padding: 0 4px; }
.formula { font-family: var(--f-num); background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; font-size: 13px; line-height: 1.8; overflow-x: auto; }
.memo { font-family: var(--f-memo); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 28px 32px; max-width: 78ch; display: flex; flex-direction: column; gap: 10px; font-size: 15px; line-height: 1.6; }
.memo h2 { font-family: var(--f-ui); font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent); margin-top: 10px; }
.memo h1 { font-family: var(--f-memo); font-size: 26px; font-weight: 600; }
.memo ul { margin: 0; padding-left: 20px; }
.rec { font-family: var(--f-ui); display: inline-flex; padding: 3px 10px; border-radius: 6px; font-weight: 700; letter-spacing: 0.04em; font-size: 12px; }
.rec.cond { background: var(--warnsoft); color: var(--warn); }
.rec.go { background: var(--oksoft); color: var(--ok); }
.rec.stop { background: var(--risksoft); color: var(--risk); }
.rec.more { background: var(--panel2); color: var(--muted); border: 1px solid var(--line); }
.toast { position: fixed; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); right: calc(18px + env(safe-area-inset-right, 0px)); background: var(--ink); color: var(--panel); padding: 9px 14px; border-radius: 8px; z-index: 60; font-size: 13px; }
.steps { display: flex; flex-direction: column; gap: 6px; }
.step { display: flex; gap: 8px; align-items: center; font-size: 13px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); flex: none; }
.dot.on { background: var(--accent); }
.dot.done { background: var(--ok); }
.hscroll { overflow-x: auto; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.between { justify-content: space-between; }
.stack { display: flex; flex-direction: column; gap: 8px; }
.tree { display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
.tree div { padding-left: calc(var(--d) * 14px); }

@media (max-width: 1100px) { .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g-main { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .rail { position: static; height: auto; flex-direction: row; align-items: center; padding: 10px max(16px, env(safe-area-inset-left, 0px)); overflow-x: auto; gap: 12px; }
  .nav { flex-direction: row; } .nav-group, .rail-foot, .brand span { display: none; }
  .nav a { white-space: nowrap; }
  .g2, .g3 { grid-template-columns: minmax(0, 1fr); }
  .strip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .strip > div:nth-child(3) { border-left: 0; }
  .strip > div:nth-child(n+3) { border-top: 1px solid var(--line); }
  .topbar { position: static; }
  .memo { padding: 18px; }
}
@media (max-width: 520px) { .g4 { grid-template-columns: minmax(0, 1fr); } }
</style></head>
